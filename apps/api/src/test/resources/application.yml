spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    placeholders:
      seed_user_email: ""
      seed_user_name: ""
      seed_user_password_hash: ""

jwt:
  secret: test-secret-must-be-at-least-32-bytes
  access-expiration: 900000
  refresh-expiration: 604800000

cors:
  frontend: http://localhost:3000

cookies:
  secure: false

app:
  uploads:
    max-profile-image-bytes: 2097152
