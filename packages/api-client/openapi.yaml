components:
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    FinancingDraft:
      {
        type: 'object',
        required:
          [
            'name',
            'kind',
            'categoryId',
            'paymentMethod',
            'system',
            'amount',
            'term',
            'firstDueDate',
          ],
        properties:
          {
            purchasePrice: { type: ['number', 'null'] },
            downPayment: { type: ['number', 'null'] },
            iof: { type: ['number', 'null'] },
            registration: { type: ['number', 'null'] },
            valuationFee: { type: ['number', 'null'] },
            alreadyPaid: { type: ['integer', 'null'], minimum: 0 },
            amount: { type: 'number' },
            annualRate: { type: ['number', 'null'] },
            monthlyRate: { type: ['number', 'null'] },
            term: { type: 'integer', minimum: 1, maximum: 500 },
            statedInstallment: { type: ['number', 'null'] },
            insurance: { type: ['number', 'null'] },
            fees: { type: ['number', 'null'] },
            name: { type: 'string' },
            lender: { type: ['string', 'null'] },
            categoryId: { type: 'string' },
            accountId: { type: ['string', 'null'] },
            kind: { type: 'string', enum: ['VEHICLE', 'REAL_ESTATE', 'OTHER'] },
            system: { type: 'string', enum: ['SAC', 'PRICE'] },
            paymentMethod: { $ref: '#/components/schemas/PaymentMethod' },
            firstDueDate: { type: 'string', pattern: "^\\d{4}/\\d{2}/\\d{2}$" },
          },
      }
    FinancingRow:
      {
        type: 'object',
        required:
          [
            'status',
            'number',
            'dueDate',
            'principal',
            'interest',
            'insurance',
            'fees',
            'payment',
            'balance',
          ],
        properties:
          {
            status: { type: 'string', enum: ['SCHEDULED', 'PAID'] },
            number: { type: 'number' },
            principal: { type: 'number' },
            interest: { type: 'number' },
            insurance: { type: 'number' },
            fees: { type: 'number' },
            payment: { type: 'number' },
            balance: { type: 'number' },
            dueDate: { type: 'string' },
            paidAmount: { type: ['number', 'null'] },
          },
      }
    FinancingPreview:
      {
        type: 'object',
        required:
          ['effectiveMonthlyRate', 'totalInterest', 'totalPaid', 'schedule'],
        properties:
          {
            effectiveMonthlyRate: { type: 'number' },
            totalInterest: { type: 'number' },
            totalPaid: { type: 'number' },
            schedule:
              {
                type: 'array',
                items: { $ref: '#/components/schemas/FinancingRow' },
              },
          },
      }
    Financing:
      {
        type: 'object',
        required: ['id', 'contract', 'calculation', 'extraPaid', 'payoffDate'],
        properties:
          {
            id: { type: 'string' },
            contract: { $ref: '#/components/schemas/FinancingDraft' },
            calculation: { $ref: '#/components/schemas/FinancingPreview' },
            extraPaid: { type: 'number' },
            payoffDate: { type: 'string' },
          },
      }
    FinancingAdjustment:
      {
        type: 'object',
        required: ['date', 'amount'],
        properties:
          {
            date: { type: 'string' },
            amount: { type: 'number' },
            option: { type: 'string', enum: ['REDUCE_TERM', 'REDUCE_PAYMENT'] },
          },
      }
    FinancingSimulation:
      {
        type: 'object',
        required: ['option', 'interestSaved', 'schedule'],
        properties:
          {
            option: { type: 'string', enum: ['REDUCE_TERM', 'REDUCE_PAYMENT'] },
            interestSaved: { type: 'number' },
            schedule:
              {
                type: 'array',
                items: { $ref: '#/components/schemas/FinancingRow' },
              },
          },
      }
    TransactionType: { type: string, enum: [INCOME, EXPENSE] }
    RepeatInterval:
      { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY, NONE] }
    InvestmentType:
      type: string
      description: The kind of investment; set exactly when the location is INVESTMENT.
      enum:
        [
          TESOURO_DIRETO,
          CDB,
          LCI_LCA,
          CREDIT_BONDS,
          STOCKS,
          REAL_ESTATE_FUNDS,
          ETFS,
          BDRS,
          CRYPTO,
          INVESTMENT_FUNDS,
          PRIVATE_PENSION,
          FOREIGN,
          OTHER_INVESTMENT,
        ]
    SavingLocation:
      {
        type: string,
        enum: [CASH, CHECKING_ACCOUNT, SAVINGS_ACCOUNT, INVESTMENT, OTHER],
      }
    UserRole: { type: string, enum: [ADMIN, USER] }
    Message:
      type: object
      required: [message]
      properties: { message: { type: string } }
    ErrorResponse:
      type: object
      required: [status, title, message]
      properties:
        {
          status: { type: string, examples: [UNAUTHORIZED] },
          title: { type: string, examples: [Unauthorized] },
          message: { type: string },
        }
    CsrfToken:
      type: object
      required: [token]
      properties: { token: { type: string } }
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, minLength: 8 },
        }
    Role:
      type: object
      required: [id, roleName]
      properties:
        {
          id: { type: string, format: uuid },
          roleName: { $ref: '#/components/schemas/UserRole' },
        }
    User:
      type: object
      required:
        [id, name, email, roles, salaryDay, mainAccountId, goalMonthlyPace]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        salaryDay: { type: ['integer', 'null'], minimum: 1, maximum: 31 }
        mainAccountId: { type: ['string', 'null'], format: uuid }
        goalMonthlyPace: { type: ['number', 'null'], minimum: 0 }
    UserUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 50 }
        password:
          { type: string, description: New password; requires currentPassword }
        currentPassword:
          {
            type: string,
            description: Required for password changes; missing and wrong values return the same 400 message,
          }
    UserPreferences:
      type: object
      required: [salaryDay]
      properties:
        salaryDay: { type: ['integer', 'null'], minimum: 1, maximum: 31 }
        mainAccountId: { type: ['string', 'null'], format: uuid }
    UserDataSummary:
      type: object
      required: [firstEntryDate, entryCount, maxProfileImageBytes]
      properties:
        firstEntryDate: { type: ['string', 'null'], format: date }
        entryCount: { type: integer, format: int64 }
        maxProfileImageBytes: { type: integer, format: int64 }
    UserBackup:
      type: object
      required: [version, exportedAt, sections]
      properties:
        version: { type: integer, example: 1 }
        exportedAt: { type: string, format: date-time }
        sections:
          type: object
          required:
            [
              profile,
              categories,
              transactions,
              installments,
              monthlyOverrides,
              cards,
              accounts,
              savings,
              goals,
              goalAllocations,
              financings,
              financingChanges,
            ]
          additionalProperties:
            type: array
            items: { type: object, additionalProperties: true }
    UserWrite:
      type: object
      required: [email, password]
      properties:
        {
          name: { type: string, maxLength: 50 },
          email: { type: string, format: email },
          password: { type: string },
        }
    Category:
      type: object
      required: [id, name, transactionType]
      properties:
        {
          id: { type: string, format: uuid },
          name: { type: string },
          transactionType: { $ref: '#/components/schemas/TransactionType' },
          fixedCost: { type: ['boolean', 'null'] },
        }
    Installment:
      type: object
      required: [id, installmentNumber, totalInstallments, amount, dueDate]
      properties:
        {
          id: { type: string, format: uuid },
          installmentNumber: { type: integer },
          totalInstallments: { type: integer },
          amount: { type: number },
          dueDate: { type: string },
          paidEarly:
            {
              type: boolean,
              description: Paid before its month; dueDate is then the day it was paid.,
            },
        }
    Bank:
      type: string
      enum:
        [
          NUBANK,
          ITAU,
          BRADESCO,
          BANCO_DO_BRASIL,
          CAIXA,
          SANTANDER,
          INTER,
          C6,
          BTG_PACTUAL,
          XP,
          PORTO,
          MERCADO_PAGO,
          PICPAY,
          PAGBANK,
          SICREDI,
          SICOOB,
          BANRISUL,
          NEON,
          OTHER,
        ]
    PaymentMethod:
      type: string
      enum:
        [
          CREDIT_CARD,
          DEBIT_CARD,
          PIX,
          BANK_TRANSFER,
          BOLETO,
          AUTOMATIC_DEBIT,
          CASH,
          OTHER,
        ]
    AccountWrite:
      type: object
      required: [name, bank]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        bank: { $ref: '#/components/schemas/Bank' }
    Account:
      allOf:
        - { $ref: '#/components/schemas/AccountWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            balance: { type: number }
            balanceCheckpointDate:
              { type: [string, 'null'], description: yyyy/MM/dd }
    TransactionWrite:
      type: object
      required: [category, totalValue, repeats, date]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        cardId: { type: [string, 'null'], format: uuid }
        paymentMethod:
          anyOf:
            [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }]
        accountId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }
        totalValue: { type: number }
        installmentNumbers: { type: [integer, 'null'] }
        repeats: { $ref: '#/components/schemas/RepeatInterval' }
        date: { type: string }
    CardWrite:
      type: object
      required: [name, bank, closingDay, dueDay]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        bank: { $ref: '#/components/schemas/Bank' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        paymentAccountId: { type: [string, 'null'], format: uuid }
        fundingAccountId: { type: [string, 'null'], format: uuid }
        billPaymentMethod:
          {
            type: [string, 'null'],
            enum: [PIX, BANK_TRANSFER, BOLETO, AUTOMATIC_DEBIT, OTHER, null],
          }
        creditLimit:
          {
            type: [number, 'null'],
            exclusiveMinimum: 0,
            multipleOf: 0.01,
            maximum: 99999999999999999.99,
          }
    Card:
      type: object
      required: [id, name, bank, closingDay, dueDay]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bank: { $ref: '#/components/schemas/Bank' }
        closingDay: { type: integer }
        dueDay: { type: integer }
        paymentAccount:
          anyOf: [{ $ref: '#/components/schemas/Account' }, { type: 'null' }]
        fundingAccount:
          anyOf: [{ $ref: '#/components/schemas/Account' }, { type: 'null' }]
        billPaymentMethod:
          {
            type: [string, 'null'],
            enum: [PIX, BANK_TRANSFER, BOLETO, AUTOMATIC_DEBIT, OTHER, null],
          }
        creditLimit: { type: [number, 'null'] }
        usedLimit: { type: [number, 'null'] }
        availableLimit: { type: [number, 'null'] }
    CardSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Transaction:
      allOf:
        - { $ref: '#/components/schemas/TransactionWrite' }
        - type: object
          required: [id]
          properties:
            {
              id: { type: string, format: uuid },
              source:
                { type: string, enum: [MANUAL, FINANCING], readOnly: true },
              financingId:
                { type: [string, 'null'], format: uuid, readOnly: true },
              account:
                {
                  anyOf:
                    [
                      { $ref: '#/components/schemas/Account' },
                      { type: 'null' },
                    ],
                  readOnly: true,
                },
              card:
                {
                  anyOf:
                    [
                      { $ref: '#/components/schemas/CardSummary' },
                      { type: 'null' },
                    ],
                  readOnly: true,
                },
              billDueDate:
                {
                  type: [string, 'null'],
                  readOnly: true,
                  description: 'yyyy/MM/dd; first installment bill or purchase bill',
                },
              repeatUntil:
                {
                  type: [string, 'null'],
                  description: 'Last month, as yyyy/MM/01',
                },
              months:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/TransactionMonth' },
                },
              installments:
                {
                  type: [array, 'null'],
                  items: { $ref: '#/components/schemas/Installment' },
                },
            }
    MonthChange:
      type: object
      required: [amount, date]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        date:
          { type: string, description: 'yyyy/MM/dd inside the selected month' }
        notes: { type: [string, 'null'] }
    TransactionMonth:
      type: object
      required: [month, skipped]
      properties:
        month: { type: string, description: yyyy-MM }
        amount: { type: [number, 'null'] }
        date: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        skipped: { type: boolean }
    TransactionPage:
      type: object
      required: [content, first, last, number, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        first: { type: boolean }
        last: { type: boolean }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    SavingWrite:
      type: object
      required: [name, amount, location]
      properties:
        {
          name: { type: string },
          amount: { type: number },
          location: { $ref: '#/components/schemas/SavingLocation' },
          investmentType:
            {
              oneOf:
                [
                  { $ref: '#/components/schemas/InvestmentType' },
                  { type: 'null' },
                ],
              description: Required for INVESTMENT,
              absent otherwise.,
            },
        }
    Saving:
      allOf:
        - { $ref: '#/components/schemas/SavingWrite' }
        - type: object
          required: [id]
          properties:
            {
              id: { type: string, format: uuid },
              invested: { type: number, readOnly: true },
              gain: { type: number, readOnly: true },
              updatedAt:
                {
                  type: string,
                  format: date-time,
                  readOnly: true,
                  description: When the balance last changed.,
                },
            }
    StatementPreview:
      type: object
      required: [source, totalsMatch, lines]
      properties:
        source:
          {
            type: string,
            enum: [BRADESCO_CARD_PDF, NUBANK_CARD_PDF, NUBANK_CARD_CSV],
          }
        billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
        statementDate:
          {
            type: [string, 'null'],
            description: 'yyyy/MM/dd; open bill export date',
          }
        printedTotal: { type: [number, 'null'] }
        parsedTotal: { type: [number, 'null'] }
        totalsMatch: { type: boolean }
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementPreviewLine' },
          }
    StatementPreviewLine:
      type: object
      required: [index, date, description, amount, credit, duplicate, selected]
      properties:
        index: { type: integer }
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        paidEarly:
          {
            type: boolean,
            description: A prepaid installment; it moves the installment instead of adding an expense.,
          }
        cardholder: { type: [string, 'null'] }
        suggestedCategoryId: { type: [string, 'null'], format: uuid }
        suggestionSource:
          type: [string, 'null']
          enum: [DUPLICATE, PURCHASE, EXACT, MERCHANT, KEYWORD, SIMILAR, null]
          description: Where the suggested category comes from, strongest first.
        suggestionBasis:
          type: [string, 'null']
          description: The saved description or the keyword behind the suggestion.
        suggestionCount:
          type: integer
          description: How many saved transactions back the suggestion (0 for keywords).
        merchantKey:
          type: string
          description: Lines with the same key are the same merchant.
        duplicate: { type: boolean }
        duplicateOfTransactionId: { type: [string, 'null'], format: uuid }
        duplicateOfLine: { type: [integer, 'null'] }
        samePurchaseAsLine:
          {
            type: [integer, 'null'],
            description: For a prepaid installment,
            the line that creates its purchase.,
          }
        samePurchaseAsTransactionId:
          {
            type: [string, 'null'],
            format: uuid,
            description: For a prepaid installment,
            the saved purchase it moves.,
          }
        selected: { type: boolean }
        subscriptionName: { type: [string, 'null'] }
        updateMonthAvailable:
          {
            type: boolean,
            description: A matching subscription can take this amount for the bill month only.,
          }
    StatementImportRequest:
      type: object
      required: [lines]
      properties:
        cardId: { type: [string, 'null'], format: uuid }
        billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementImportLine' },
          }
    StatementImportLine:
      type: object
      required: [date, description, amount, credit, categoryId]
      properties:
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        paidEarly: { type: boolean }
        categoryId: { type: string, format: uuid }
        updateMonth:
          {
            type: boolean,
            default: false,
            description: Confirm updating the matching subscription occurrence only.,
          }
    StatementImportResult:
      type: object
      required:
        [
          imported,
          skippedAsDuplicates,
          movedInstallments,
          installmentAmountsAdjusted,
        ]
      properties:
        installmentAmountsAdjusted:
          {
            type: integer,
            description: Installment amounts replaced with bank amounts within one real.,
          }
        billDatesSet:
          {
            type: integer,
            description: Saved purchases moved to their bill month without duplicating them,
          }
        imported: { type: integer }
        skippedAsDuplicates: { type: integer }
        movedInstallments:
          {
            type: integer,
            description: Installments moved to the day they were prepaid.,
          }
    InstallmentChange:
      type: object
      required: [installmentNumbers]
      properties:
        installmentNumbers: { type: array, items: { type: integer } }
        paidOn:
          {
            type: string,
            examples: ['2026/10/02'],
            description: Required to pay early.,
          }

    MovementWrite:
      type: object
      required: [kind, date, amount]
      properties:
        kind:
          {
            type: string,
            enum: [TRANSFER, CARD_BILL_PAYMENT, INVESTMENT, REDEMPTION],
          }
        date: { type: string, description: yyyy/MM/dd }
        amount: { type: number, exclusiveMinimum: 0 }
        fromAccountId: { type: [string, 'null'], format: uuid }
        toAccountId: { type: [string, 'null'], format: uuid }
        cardId: { type: [string, 'null'], format: uuid }
        billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
        savingId: { type: [string, 'null'], format: uuid }
        opening: { type: boolean, default: false }
        notes: { type: [string, 'null'], maxLength: 4000 }
        paymentMethod:
          type: [string, 'null']
          enum: [PIX, BANK_TRANSFER, BOLETO, AUTOMATIC_DEBIT, OTHER, null]
          description: Transfers accept only PIX, BANK_TRANSFER or OTHER; investments and redemptions require null.
    Movement:
      allOf:
        - { $ref: '#/components/schemas/MovementWrite' }
        - type: object
          required: [id, automatic, opening]
          properties:
            id: { type: [string, 'null'], format: uuid }
            automatic: { type: boolean }
    BalanceCheckpointWrite:
      type: object
      required: [date, balance]
      properties:
        date: { type: string, description: yyyy/MM/dd }
        balance: { type: number }
        preview: { type: boolean, default: false }
    BalanceResult:
      type: object
      required: [date, computed, balance, difference, saved]
      properties:
        date: { type: string, description: yyyy/MM/dd }
        computed: { type: number }
        balance: { type: number }
        difference: { type: number }
