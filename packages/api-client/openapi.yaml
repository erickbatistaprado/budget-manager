        cardId: { type: string, format: uuid }
        card: { type: string }
        dueDate: { type: string, description: yyyy/MM/dd }
        total: { type: number }
        paymentAccount:
          anyOf: [{ $ref: '#/components/schemas/Account' }, { type: 'null' }]
        automatic: { type: boolean }
        paid: { type: boolean }
        creditLimit: { type: [number, 'null'] }
        availableLimit: { type: [number, 'null'] }
    Unassigned:
      type: object
      required: [count, total]
      properties:
        count: { type: integer }
        total: { type: number }
    MonthOverview:
      type: object
      required:
        [
          month,
          incomes,
          expenses,
          surplus,
          invested,
          kept,
          accounts,
          bills,
          unassigned,
        ]
      properties:
        month: { type: string, description: yyyy-MM }
        incomes: { type: number }
        expenses: { type: number }
        surplus: { type: number }
        invested: { type: number }
        kept: { type: number }
        accounts:
          {
            type: array,
            items: { $ref: '#/components/schemas/OverviewAccount' },
          }
        bills:
          { type: array, items: { $ref: '#/components/schemas/OverviewBill' } }
        unassigned: { $ref: '#/components/schemas/Unassigned' }
    Evolution:
      type: object
      required:
        [
          month,
          incomes,
          expenses,
          surplus,
          invested,
          accounts,
          savings,
          debt,
          netWorth,
        ]
      properties:
        month: { type: string, description: yyyy-MM }
        incomes: { type: number }
        expenses: { type: number }
        surplus: { type: number }
        invested: { type: number }
        accounts: { type: number }
        savings: { type: number }
        debt: { type: number }
        netWorth: { type: number }
    GoalDraft:
      type: object
      required: [name, price, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        kind: { type: string, enum: [NEED, WANT] }
        link: { type: ['string', 'null'], maxLength: 2000 }
        notes: { type: ['string', 'null'], maxLength: 4000 }
        targetDate: { type: ['string', 'null'], pattern: '^\d{4}/\d{2}/\d{2}$' }
        monthlyAmount:
          { type: ['number', 'null'], minimum: 0, multipleOf: 0.01 }
        savingId: { type: ['string', 'null'], format: uuid }
    Goal:
      allOf:
        - { $ref: '#/components/schemas/GoalDraft' }
        - type: object
          required: [id, position, status]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer, minimum: 1 }
            status: { type: string, enum: [ACTIVE, ACHIEVED, CANCELLED] }
            achievedAt:
              { type: ['string', 'null'], pattern: '^\d{4}/\d{2}/\d{2}$' }
            expenseTransactionId: { type: ['string', 'null'], format: uuid }
            savedAtPurchase: { type: ['number', 'null'] }
            actualPrice: { type: ['number', 'null'] }
    GoalPosition:
      type: object
      required: [position]
      properties:
        position: { type: integer, minimum: 1 }
    GoalPace:
      type: object
      required: [monthlyAmount]
      properties:
        monthlyAmount:
          {
            type: ['number', 'null'],
            minimum: 0,
            multipleOf: 0.01,
            description: Null restores the average of the last six complete months; negative kept counts as zero,
          }
    GoalAllocationDraft:
      type: object
      required: [date, amount]
      properties:
        date: { type: string, pattern: '^\d{4}/\d{2}/\d{2}$' }
        amount:
          {
            type: number,
            multipleOf: 0.01,
            description: Positive reserves money; negative releases it without redeeming linked savings. Cannot release more than saved.,
          }
        fromAccountId:
          {
            type: ['string', 'null'],
            format: uuid,
            description: Required for positive allocations with a linked saving,
          }
    GoalAllocation:
      type: object
      required: [id, goalId, date, amount, movementId]
      properties:
        id: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        date: { type: string, pattern: '^\d{4}/\d{2}/\d{2}$' }
        amount: { type: number }
        movementId: { type: ['string', 'null'], format: uuid }
    GoalForecast:
      type: object
      required:
        [
          id,
          saved,
          remaining,
          expectedMonth,
          late,
          extraMonthlyAmount,
          firstPositionMonth,
        ]
      properties:
        id: { type: string, format: uuid }
        saved: { type: number }
        remaining: { type: number }
        expectedMonth:
          {
            type: ['string', 'null'],
            pattern: '^\d{4}-\d{2}$',
            description: Null means not funded within 120 months; projection starts in the current month,
          }
        late: { type: boolean }
        extraMonthlyAmount:
          {
            type: ['number', 'null'],
            description: Additional monthly pace needed in the current order; null for past targets or targets beyond the horizon,
          }
        firstPositionMonth:
          { type: ['string', 'null'], pattern: '^\d{4}-\d{2}$' }
    GoalPlan:
      type: object
      required: [pace, averagePace, paceOverride, reserved, goals]
      properties:
        pace: { type: number }
        averagePace: { type: number }
        paceOverride: { type: ['number', 'null'] }
        reserved:
          {
            type: number,
            description: Allocations without a saving; subtract from account balances for free available money,
          }
        goals:
          { type: array, items: { $ref: '#/components/schemas/GoalForecast' } }
    CategoryFixedCost:
      type: object
      properties:
        fixedCost: { type: ['boolean', 'null'] }
    GoalSplitDraft:
      type: object
      required: [date, amount, preview]
      description: Preview writes nothing. Confirmation saves goal allocations only; create the investment remainder through POST /movements. Amount cannot exceed kept less this month's unsaved reservations. Omitted allocations use fixed contributions then waterfall; supplied allocations replace the default split.
      properties:
        date: { type: string, pattern: '^\d{4}/\d{2}/\d{2}$' }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        fromAccountId: { type: ['string', 'null'], format: uuid }
        preview: { type: boolean }
        allocations:
          type: object
          additionalProperties: { type: number, minimum: 0, multipleOf: 0.01 }
    GoalSplit:
      type: object
      required: [goals, investmentAmount, saved]
      properties:
        goals:
          type: object
          additionalProperties: { type: number }
        investmentAmount: { type: number }
        saved: { type: boolean }
    GoalPurchaseDraft:
      type: object
      required: [price, date, categoryId, paymentMethod]
      properties:
        price: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        date: { type: string, pattern: '^\d{4}/\d{2}/\d{2}$' }
        categoryId: { type: string, format: uuid }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        cardId: { type: ['string', 'null'], format: uuid }
        accountId: { type: ['string', 'null'], format: uuid }
        installments: { type: ['integer', 'null'], minimum: 2, maximum: 500 }
        redemptionAccountId:
          {
            type: ['string', 'null'],
            format: uuid,
            description: Destination for a linked saving when paying with cash or other. Card purchases always redeem into the main account.,
          }
    GoalSavingsTip:
      type: object
      required:
        [
          categoryId,
          category,
          amount,
          average,
          difference,
          percentAbove,
          goalId,
          goalName,
          expectedMonth,
          improvedMonth,
          monthsGained,
        ]
      properties:
        categoryId: { type: string, format: uuid }
        category: { type: string }
        amount: { type: number }
        average: { type: number }
        difference: { type: number }
        percentAbove: { type: ['number', 'null'] }
        goalId: { type: ['string', 'null'], format: uuid }
        goalName: { type: ['string', 'null'] }
        expectedMonth: { type: ['string', 'null'], pattern: '^\d{4}-\d{2}$' }
        improvedMonth: { type: ['string', 'null'], pattern: '^\d{4}-\d{2}$' }
        monthsGained: { type: ['integer', 'null'], minimum: 0 }
