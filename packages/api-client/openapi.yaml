openapi: 3.1.0
info:
  title: Budget Manager API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          {
            description: CSRF token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CsrfToken' } },
              },
          }
  /auth/login:
    post:
      operationId: login
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/AuthRequest' } },
            },
        }
      responses:
        '200':
          {
            description: Authenticated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /auth/refresh:
    post:
      operationId: refreshSession
      description: Swaps the refresh_token cookie for a new one and issues a new access_token cookie. Each refresh token works once.
      responses:
        '200':
          {
            description: Session refreshed,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
        '401':
          {
            description: Refresh token missing,
            expired or already used. The cookies are left as they are; another tab may have rotated them.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          {
            description: Signed out,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /users:
    post:
      operationId: createUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
    put:
      operationId: updateUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserWrite' } },
            },
        }
      responses:
        '204': { description: Updated }
  /users/current:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          {
            description: Current user,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
  /categories/type/{transactionType}:
    get:
      operationId: listCategoriesByType
      parameters:
        - {
            name: transactionType,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
      responses:
        '200':
          {
            description: Categories,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Category' },
                      },
                  },
              },
          }
  /transactions:
    get:
      operationId: listTransactions
      parameters:
        - {
            name: transactionType,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
        - {
            name: startDate,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: endDate, in: query, required: true, schema: { type: string } }
        - {
            name: sortKey,
            in: query,
            schema:
              {
                type: string,
                enum: [category, notes, date, value],
                default: date,
              },
          }
        - {
            name: sortOrder,
            in: query,
            schema: { type: string, enum: [asc, desc], default: asc },
          }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          {
            description: Transaction page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/TransactionPage' } },
              },
          }
    post:
      operationId: createTransaction
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/TransactionWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Transaction' } },
              },
          }
  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /savings:
    get:
      operationId: listSavings
      responses:
        '200':
          {
            description: Savings,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Saving' },
                      },
                  },
              },
          }
    post:
      operationId: createSaving
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/SavingWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Saving' } },
              },
          }
  /savings/{id}:
    delete:
      operationId: deleteSaving
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /statement-imports/preview:
    post:
      operationId: previewStatementImport
      description: Reads a Bradesco card PDF, NuBank card PDF or NuBank card CSV and shows what would be imported. Nothing is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, description: Only for protected PDFs }
      responses:
        '200':
          description: Statement lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementPreview' }
        '415': { description: Not a supported statement }
        '422':
          {
            description: Supported bank but unreadable content,
            such as a scanned PDF,
          }
        '423':
          { description: The PDF needs a password, or the password is wrong }
  /statement-imports:
    post:
      operationId: importStatementLines
      description: Saves the chosen lines. Lines matching a saved transaction by date, amount, description and category (installments by description, count, amount and category) are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementImportRequest' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementImportResult' }
components:
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    TransactionType: { type: string, enum: [INCOME, EXPENSE] }
    RepeatInterval:
      { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY, NONE] }
    SavingLocation:
      {
        type: string,
        enum: [CASH, CHECKING_ACCOUNT, SAVINGS_ACCOUNT, INVESTMENT, OTHER],
      }
    UserRole: { type: string, enum: [ADMIN, USER] }
    Message:
      type: object
      required: [message]
      properties: { message: { type: string } }
    ErrorResponse:
      type: object
      required: [status, title, message]
      properties:
        {
          status: { type: string, examples: [UNAUTHORIZED] },
          title: { type: string, examples: [Unauthorized] },
          message: { type: string },
        }
    CsrfToken:
      type: object
      required: [token]
      properties: { token: { type: string } }
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, minLength: 8 },
        }
    Role:
      type: object
      required: [id, roleName]
      properties:
        {
          id: { type: string, format: uuid },
          roleName: { $ref: '#/components/schemas/UserRole' },
        }
    User:
      type: object
      required: [id, name, email, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    UserWrite:
      type: object
      required: [email]
      properties:
        {
          id: { type: string, format: uuid },
          name: { type: string },
          email: { type: string, format: email },
          password: { type: string },
        }
    Category:
      type: object
      required: [id, name, transactionType]
      properties:
        {
          id: { type: string, format: uuid },
          name: { type: string },
          transactionType: { $ref: '#/components/schemas/TransactionType' },
        }
    Installment:
      type: object
      required: [id, installmentNumber, totalInstallments, amount, dueDate]
      properties:
        {
          id: { type: string, format: uuid },
          installmentNumber: { type: integer },
          totalInstallments: { type: integer },
          amount: { type: number },
          dueDate: { type: string },
        }
    TransactionWrite:
      type: object
      required: [category, totalValue, repeats, date]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        notes: { type: [string, 'null'] }
        totalValue: { type: number }
        installmentNumbers: { type: [integer, 'null'] }
        repeats: { $ref: '#/components/schemas/RepeatInterval' }
        date: { type: string }
    Transaction:
      allOf:
        - { $ref: '#/components/schemas/TransactionWrite' }
        - type: object
          required: [id]
          properties:
            {
              id: { type: string, format: uuid },
              installments:
                {
                  type: [array, 'null'],
                  items: { $ref: '#/components/schemas/Installment' },
                },
            }
    TransactionPage:
      type: object
      required: [content, first, last, number, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        first: { type: boolean }
        last: { type: boolean }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    SavingWrite:
      type: object
      required: [name, amount, location]
      properties:
        {
          name: { type: string },
          amount: { type: number },
          location: { $ref: '#/components/schemas/SavingLocation' },
        }
    Saving:
      allOf:
        - { $ref: '#/components/schemas/SavingWrite' }
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    StatementPreview:
      type: object
      required: [source, totalsMatch, lines]
      properties:
        source:
          {
            type: string,
            enum: [BRADESCO_CARD_PDF, NUBANK_CARD_PDF, NUBANK_CARD_CSV],
          }
        printedTotal: { type: [number, 'null'] }
        parsedTotal: { type: [number, 'null'] }
        totalsMatch: { type: boolean }
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementPreviewLine' },
          }
    StatementPreviewLine:
      type: object
      required: [index, date, description, amount, credit, duplicate, selected]
      properties:
        index: { type: integer }
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        cardholder: { type: [string, 'null'] }
        suggestedCategoryId: { type: [string, 'null'], format: uuid }
        duplicate: { type: boolean }
        duplicateOfTransactionId: { type: [string, 'null'], format: uuid }
        duplicateOfLine: { type: [integer, 'null'] }
        selected: { type: boolean }
    StatementImportRequest:
      type: object
      required: [lines]
      properties:
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementImportLine' },
          }
    StatementImportLine:
      type: object
      required: [date, description, amount, credit, categoryId]
      properties:
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        categoryId: { type: string, format: uuid }
    StatementImportResult:
      type: object
      required: [imported, skippedAsDuplicates]
      properties:
        imported: { type: integer }
        skippedAsDuplicates: { type: integer }
