openapi: 3.1.0
info:
  title: Budget Manager API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: The current user's accounts
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/Account' } }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountWrite' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid name or bank, or name already in use }
  /accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountWrite' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid name or bank, or name already in use }
        '404': { description: Account not found for this owner }
    delete:
      operationId: deleteAccount
      responses:
        '204':
          { description: Deleted; transaction account references are cleared }
        '404': { description: Account not found for this owner }
  /cards:
    get:
      operationId: listCards
      responses:
        '200':
          description: The current user's cards
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/Card' } }
    post:
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardWrite' }
      responses:
        '201':
          description: Created card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { description: Invalid name or days, or name already in use }
  /cards/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardWrite' }
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { description: Invalid name or days, or name already in use }
        '404': { description: Card not found for this owner }
    delete:
      operationId: deleteCard
      responses:
        '204': { description: Deleted; purchases retain their bill dates }
        '404': { description: Card not found for this owner }
  /auth/csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          {
            description: CSRF token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CsrfToken' } },
              },
          }
  /auth/login:
    post:
      operationId: login
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/AuthRequest' } },
            },
        }
      responses:
        '200':
          {
            description: Authenticated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /auth/refresh:
    post:
      operationId: refreshSession
      description: Swaps the refresh_token cookie for a new one and issues a new access_token cookie. Each refresh token works once.
      responses:
        '200':
          {
            description: Session refreshed,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
        '401':
          {
            description: Refresh token missing,
            expired or already used. The cookies are left as they are; another tab may have rotated them.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          {
            description: Signed out,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /users:
    post:
      operationId: createUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
    put:
      operationId: updateUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserWrite' } },
            },
        }
      responses:
        '204': { description: Updated }
  /users/current:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          {
            description: Current user,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
  /categories/type/{transactionType}:
    get:
      operationId: listCategoriesByType
      parameters:
        - {
            name: transactionType,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
      responses:
        '200':
          {
            description: Categories,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Category' },
                      },
                  },
              },
          }
  /transactions:
    get:
      operationId: listTransactions
      parameters:
        - {
            name: transactionType,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
        - {
            name: startDate,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: endDate, in: query, required: true, schema: { type: string } }
        - {
            name: sortKey,
            in: query,
            schema:
              {
                type: string,
                enum: [category, notes, date, value],
                default: date,
              },
          }
        - {
            name: sortOrder,
            in: query,
            schema: { type: string, enum: [asc, desc], default: asc },
          }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          {
            description: Transaction page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/TransactionPage' } },
              },
          }
    post:
      operationId: createTransaction
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/TransactionWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Transaction' } },
              },
          }
  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /transactions/{id}/installments/pay-early:
    post:
      operationId: payInstallmentsEarly
      description: Moves installments the card prepaid to the day they were paid. The date cannot be after an installment's original due date.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallmentChange' }
      responses:
        '200':
          description: The transaction with its updated installments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /transactions/{id}/installments/restore:
    post:
      operationId: restoreInstallments
      description: Puts paid-early installments back in their original months.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallmentChange' }
      responses:
        '200':
          description: The transaction with its updated installments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /transactions/{id}/months/{month}:
    put:
      operationId: changeTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthChange' }
      responses:
        '200':
          description: Updated monthly transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
    delete:
      operationId: skipTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/months/{month}/override:
    delete:
      operationId: restoreTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/split/{month}:
    post:
      operationId: splitTransaction
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionWrite' }
      responses:
        '200':
          description: Updated monthly transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/from/{month}:
    delete:
      operationId: deleteTransactionFrom
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /savings:
    get:
      operationId: listSavings
      responses:
        '200':
          {
            description: Savings,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Saving' },
                      },
                  },
              },
          }
    post:
      operationId: createSaving
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/SavingWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Saving' } },
              },
          }
  /savings/{id}:
    delete:
      operationId: deleteSaving
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /statement-imports/preview:
    post:
      operationId: previewStatementImport
      description: Reads a Bradesco card PDF, NuBank card PDF or NuBank card CSV and shows what would be imported. Nothing is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, description: Only for protected PDFs }
      responses:
        '200':
          description: Statement lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementPreview' }
        '415': { description: Not a supported statement }
        '422':
          {
            description: Supported bank but unreadable content,
            such as a scanned PDF,
          }
        '423':
          { description: The PDF needs a password, or the password is wrong }
  /statement-imports:
    post:
      operationId: importStatementLines
      description: Saves the chosen lines. Lines matching a saved transaction by date, amount, description and category (installments by description, count, amount and category) are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementImportRequest' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementImportResult' }
components:
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  schemas:
    TransactionType: { type: string, enum: [INCOME, EXPENSE] }
    RepeatInterval:
      { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY, NONE] }
    InvestmentType:
      type: string
      description: The kind of investment; set exactly when the location is INVESTMENT.
      enum:
        [
          TESOURO_DIRETO,
          CDB,
          LCI_LCA,
          CREDIT_BONDS,
          STOCKS,
          REAL_ESTATE_FUNDS,
          ETFS,
          BDRS,
          CRYPTO,
          INVESTMENT_FUNDS,
          PRIVATE_PENSION,
          FOREIGN,
          OTHER_INVESTMENT,
        ]
    SavingLocation:
      {
        type: string,
        enum: [CASH, CHECKING_ACCOUNT, SAVINGS_ACCOUNT, INVESTMENT, OTHER],
      }
    UserRole: { type: string, enum: [ADMIN, USER] }
    Message:
      type: object
      required: [message]
      properties: { message: { type: string } }
    ErrorResponse:
      type: object
      required: [status, title, message]
      properties:
        {
          status: { type: string, examples: [UNAUTHORIZED] },
          title: { type: string, examples: [Unauthorized] },
          message: { type: string },
        }
    CsrfToken:
      type: object
      required: [token]
      properties: { token: { type: string } }
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string, minLength: 8 },
        }
    Role:
      type: object
      required: [id, roleName]
      properties:
        {
          id: { type: string, format: uuid },
          roleName: { $ref: '#/components/schemas/UserRole' },
        }
    User:
      type: object
      required: [id, name, email, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    UserWrite:
      type: object
      required: [email]
      properties:
        {
          id: { type: string, format: uuid },
          name: { type: string },
          email: { type: string, format: email },
          password: { type: string },
        }
    Category:
      type: object
      required: [id, name, transactionType]
      properties:
        {
          id: { type: string, format: uuid },
          name: { type: string },
          transactionType: { $ref: '#/components/schemas/TransactionType' },
        }
    Installment:
      type: object
      required: [id, installmentNumber, totalInstallments, amount, dueDate]
      properties:
        {
          id: { type: string, format: uuid },
          installmentNumber: { type: integer },
          totalInstallments: { type: integer },
          amount: { type: number },
          dueDate: { type: string },
          paidEarly:
            {
              type: boolean,
              description: Paid before its month; dueDate is then the day it was paid.,
            },
        }
    Bank:
      type: string
      enum:
        [
          NUBANK,
          ITAU,
          BRADESCO,
          BANCO_DO_BRASIL,
          CAIXA,
          SANTANDER,
          INTER,
          C6,
          BTG_PACTUAL,
          XP,
          PORTO,
          MERCADO_PAGO,
          PICPAY,
          PAGBANK,
          SICREDI,
          SICOOB,
          BANRISUL,
          NEON,
          OTHER,
        ]
    PaymentMethod:
      type: string
      enum:
        [
          CREDIT_CARD,
          DEBIT_CARD,
          PIX,
          BANK_TRANSFER,
          BOLETO,
          AUTOMATIC_DEBIT,
          CASH,
          OTHER,
        ]
    AccountWrite:
      type: object
      required: [name, bank]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        bank: { $ref: '#/components/schemas/Bank' }
    Account:
      allOf:
        - { $ref: '#/components/schemas/AccountWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    TransactionWrite:
      type: object
      required: [category, totalValue, repeats, date]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        cardId: { type: [string, 'null'], format: uuid }
        paymentMethod:
          anyOf:
            [{ $ref: '#/components/schemas/PaymentMethod' }, { type: 'null' }]
        accountId: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }
        totalValue: { type: number }
        installmentNumbers: { type: [integer, 'null'] }
        repeats: { $ref: '#/components/schemas/RepeatInterval' }
        date: { type: string }
    CardWrite:
      type: object
      required: [name, bank, closingDay, dueDay]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        bank: { $ref: '#/components/schemas/Bank' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
    Card:
      allOf:
        - { $ref: '#/components/schemas/CardWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    CardSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Transaction:
      allOf:
        - { $ref: '#/components/schemas/TransactionWrite' }
        - type: object
          required: [id]
          properties:
            {
              id: { type: string, format: uuid },
              account:
                {
                  anyOf:
                    [
                      { $ref: '#/components/schemas/Account' },
                      { type: 'null' },
                    ],
                  readOnly: true,
                },
              card:
                {
                  anyOf:
                    [
                      { $ref: '#/components/schemas/CardSummary' },
                      { type: 'null' },
                    ],
                  readOnly: true,
                },
              billDueDate:
                {
                  type: [string, 'null'],
                  readOnly: true,
                  description: 'yyyy/MM/dd; first installment bill or purchase bill',
                },
              repeatUntil:
                {
                  type: [string, 'null'],
                  description: 'Last month, as yyyy/MM/01',
                },
              months:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/TransactionMonth' },
                },
              installments:
                {
                  type: [array, 'null'],
                  items: { $ref: '#/components/schemas/Installment' },
                },
            }
    MonthChange:
      type: object
      required: [amount, date]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        date:
          { type: string, description: 'yyyy/MM/dd inside the selected month' }
        notes: { type: [string, 'null'] }
    TransactionMonth:
      type: object
      required: [month, skipped]
      properties:
        month: { type: string, description: yyyy-MM }
        amount: { type: [number, 'null'] }
        date: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        skipped: { type: boolean }
    TransactionPage:
      type: object
      required: [content, first, last, number, size, totalElements, totalPages]
      properties:
        content:
          { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        first: { type: boolean }
        last: { type: boolean }
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    SavingWrite:
      type: object
      required: [name, amount, location]
      properties:
        {
          name: { type: string },
          amount: { type: number },
          location: { $ref: '#/components/schemas/SavingLocation' },
          investmentType:
            {
              oneOf:
                [
                  { $ref: '#/components/schemas/InvestmentType' },
                  { type: 'null' },
                ],
              description: Required for INVESTMENT,
              absent otherwise.,
            },
        }
    Saving:
      allOf:
        - { $ref: '#/components/schemas/SavingWrite' }
        - type: object
          required: [id]
          properties:
            {
              id: { type: string, format: uuid },
              updatedAt:
                {
                  type: string,
                  format: date-time,
                  readOnly: true,
                  description: When the balance last changed.,
                },
            }
    StatementPreview:
      type: object
      required: [source, totalsMatch, lines]
      properties:
        source:
          {
            type: string,
            enum: [BRADESCO_CARD_PDF, NUBANK_CARD_PDF, NUBANK_CARD_CSV],
          }
        billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
        statementDate:
          {
            type: [string, 'null'],
            description: 'yyyy/MM/dd; open bill export date',
          }
        printedTotal: { type: [number, 'null'] }
        parsedTotal: { type: [number, 'null'] }
        totalsMatch: { type: boolean }
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementPreviewLine' },
          }
    StatementPreviewLine:
      type: object
      required: [index, date, description, amount, credit, duplicate, selected]
      properties:
        index: { type: integer }
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        paidEarly:
          {
            type: boolean,
            description: A prepaid installment; it moves the installment instead of adding an expense.,
          }
        cardholder: { type: [string, 'null'] }
        suggestedCategoryId: { type: [string, 'null'], format: uuid }
        suggestionSource:
          type: [string, 'null']
          enum: [DUPLICATE, PURCHASE, EXACT, MERCHANT, KEYWORD, SIMILAR, null]
          description: Where the suggested category comes from, strongest first.
        suggestionBasis:
          type: [string, 'null']
          description: The saved description or the keyword behind the suggestion.
        suggestionCount:
          type: integer
          description: How many saved transactions back the suggestion (0 for keywords).
        merchantKey:
          type: string
          description: Lines with the same key are the same merchant.
        duplicate: { type: boolean }
        duplicateOfTransactionId: { type: [string, 'null'], format: uuid }
        duplicateOfLine: { type: [integer, 'null'] }
        samePurchaseAsLine:
          {
            type: [integer, 'null'],
            description: For a prepaid installment,
            the line that creates its purchase.,
          }
        samePurchaseAsTransactionId:
          {
            type: [string, 'null'],
            format: uuid,
            description: For a prepaid installment,
            the saved purchase it moves.,
          }
        selected: { type: boolean }
    StatementImportRequest:
      type: object
      required: [lines]
      properties:
        cardId: { type: [string, 'null'], format: uuid }
        billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
        lines:
          {
            type: array,
            items: { $ref: '#/components/schemas/StatementImportLine' },
          }
    StatementImportLine:
      type: object
      required: [date, description, amount, credit, categoryId]
      properties:
        date: { type: string, examples: ['2026/11/14'] }
        description: { type: string }
        amount: { type: number }
        credit: { type: boolean }
        installmentNumber: { type: [integer, 'null'] }
        installmentTotal: { type: [integer, 'null'] }
        paidEarly: { type: boolean }
        categoryId: { type: string, format: uuid }
    StatementImportResult:
      type: object
      required: [imported, skippedAsDuplicates, movedInstallments]
      properties:
        billDatesSet:
          {
            type: integer,
            description: Saved purchases moved to their bill month without duplicating them,
          }
        imported: { type: integer }
        skippedAsDuplicates: { type: integer }
        movedInstallments:
          {
            type: integer,
            description: Installments moved to the day they were prepaid.,
          }
    InstallmentChange:
      type: object
      required: [installmentNumbers]
      properties:
        installmentNumbers: { type: array, items: { type: integer } }
        paidOn:
          {
            type: string,
            examples: ['2026/10/02'],
            description: Required to pay early.,
          }
