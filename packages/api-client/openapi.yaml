      properties:
        date: { type: string, description: yyyy/MM/dd }
        value: { type: number, minimum: 0 }
    SavingValuation:
      allOf:
        - { $ref: '#/components/schemas/SavingValuationWrite' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    SavingHistory:
      type: object
      required: [movements, valuations]
      properties:
        movements:
          { type: array, items: { $ref: '#/components/schemas/Movement' } }
        valuations:
          {
