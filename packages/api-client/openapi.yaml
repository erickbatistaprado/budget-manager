openapi: 3.1.0
info:
  title: Budget Manager API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /movements:
    get:
      parameters:
        - {
            in: query,
            name: startDate,
            required: true,
            schema: { type: string, description: yyyy/MM/dd },
          }
        - {
            in: query,
            name: endDate,
            required: true,
            schema: { type: string, description: yyyy/MM/dd },
          }
      operationId: listMovements
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/Movement' },
                }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
    post:
      operationId: createMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementWrite' }
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /movements/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      operationId: updateMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementWrite' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movement' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
    delete:
      operationId: deleteMovement
      responses:
        '204':
          description: Successful operation
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /accounts/{id}/balance:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - {
          in: query,
          name: date,
          required: true,
          schema: { type: string, description: yyyy/MM/dd },
        }
    get:
      operationId: getAccountBalance
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResult' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /accounts/{id}/balance-checkpoints:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listBalanceCheckpoints
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/BalanceCheckpoint' },
                }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
    post:
      operationId: saveBalanceCheckpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceCheckpointWrite' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceResult' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /accounts/{id}/balance-checkpoints/{checkpointId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - {
          in: path,
          name: checkpointId,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      operationId: deleteBalanceCheckpoint
      responses:
        '204':
          description: Successful operation
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /savings/{id}/history:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getSavingHistory
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingHistory' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /savings/{id}/valuations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: valueSaving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavingValuationWrite' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingValuation' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /overview/{month}:
    parameters:
      - in: path
        name: month
        required: true
        schema: { type: string }
    get:
      operationId: getMonthOverview
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthOverview' }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /overview/evolution:
    get:
      operationId: getEvolution
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/Evolution' },
                }
        '400':
          {
            description: Invalid request or movement references prevent deletion,
          }
        '404': { description: Resource not found for this owner }
  /accounts:
    get:
      operationId: listAccounts
      responses:
        '200':
          description: The current user's accounts
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/Account' } }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountWrite' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid name or bank, or name already in use }
  /accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountWrite' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid name or bank, or name already in use }
        '404': { description: Account not found for this owner }
    delete:
      operationId: deleteAccount
      responses:
        '204':
          { description: Deleted; transaction account references are cleared }
        '404': { description: Account not found for this owner }
  /cards:
    get:
      operationId: listCards
      responses:
        '200':
          description: The current user's cards
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/Card' } }
    post:
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardWrite' }
      responses:
        '201':
          description: Created card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { description: Invalid name or days, or name already in use }
  /cards/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardWrite' }
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { description: Invalid name or days, or name already in use }
        '404': { description: Card not found for this owner }
    delete:
      operationId: deleteCard
      responses:
        '204': { description: Deleted; purchases retain their bill dates }
        '404': { description: Card not found for this owner }
  /auth/csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          {
            description: CSRF token,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CsrfToken' } },
              },
          }
  /auth/login:
    post:
      operationId: login
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/AuthRequest' } },
            },
        }
      responses:
        '200':
          {
            description: Authenticated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /auth/refresh:
    post:
      operationId: refreshSession
      description: Swaps the refresh_token cookie for a new one and issues a new access_token cookie. Each refresh token works once.
      responses:
        '200':
          {
            description: Session refreshed,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
        '401':
          {
            description: Refresh token missing,
            expired or already used. The cookies are left as they are; another tab may have rotated them.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ErrorResponse' } },
              },
          }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          {
            description: Signed out,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Message' } },
              },
          }
  /users:
    post:
      operationId: createUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
    put:
      operationId: updateUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/UserUpdate' } },
            },
        }
      responses:
        '204':
          {
            description: Updated; other refresh sessions revoked on password change,
          }
        '400':
          {
            description: Current password is missing or incorrect,
            or new password is invalid,
          }
  /users/current:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          {
            description: Current user,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/User' } },
              },
          }
  /users/current/preferences:
    put:
      operationId: updateUserPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '204': { description: Preferences saved }
        '400': { description: Salary day must be between 1 and 31 }
  /users/current/data-summary:
    get:
      operationId: getUserDataSummary
      responses:
        '200':
          description: Entry statistics and configured image limit
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDataSummary' }
  /users/current/export:
    get:
      operationId: exportUserData
      responses:
        '200':
          description: Owner-scoped backup, excluding credentials, sessions and image bytes. Child sections reference their parent IDs. Extend sections for new tables.
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="budget-manager-backup-2026-11-15.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserBackup' }
  /categories/type/{transactionType}:
    get:
      operationId: listCategoriesByType
      parameters:
        - {
            name: transactionType,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
      responses:
        '200':
          {
            description: Categories,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Category' },
                      },
                  },
              },
          }
  /transactions:
    get:
      operationId: listTransactions
      parameters:
        - {
            name: transactionType,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/TransactionType' },
          }
        - {
            name: startDate,
            in: query,
            required: true,
            schema: { type: string },
          }
        - { name: endDate, in: query, required: true, schema: { type: string } }
        - {
            name: sortKey,
            in: query,
            schema:
              {
                type: string,
                enum: [category, notes, date, value],
                default: date,
              },
          }
        - {
            name: sortOrder,
            in: query,
            schema: { type: string, enum: [asc, desc], default: asc },
          }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          {
            description: Transaction page,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/TransactionPage' } },
              },
          }
    post:
      operationId: createTransaction
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/TransactionWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Transaction' } },
              },
          }
  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /transactions/{id}/installments/pay-early:
    post:
      operationId: payInstallmentsEarly
      description: Moves installments the card prepaid to the day they were paid. The date cannot be after an installment's original due date.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallmentChange' }
      responses:
        '200':
          description: The transaction with its updated installments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /transactions/{id}/installments/restore:
    post:
      operationId: restoreInstallments
      description: Puts paid-early installments back in their original months.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallmentChange' }
      responses:
        '200':
          description: The transaction with its updated installments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /transactions/{id}/months/{month}:
    put:
      operationId: changeTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthChange' }
      responses:
        '200':
          description: Updated monthly transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
    delete:
      operationId: skipTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/months/{month}/override:
    delete:
      operationId: restoreTransactionMonth
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/split/{month}:
    post:
      operationId: splitTransaction
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionWrite' }
      responses:
        '200':
          description: Updated monthly transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /transactions/{id}/from/{month}:
    delete:
      operationId: deleteTransactionFrom
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: month
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Updated monthly series }
        '400': { description: Invalid month or change }
        '404': { description: Transaction not found for current owner }
  /savings:
    get:
      operationId: listSavings
      responses:
        '200':
          {
            description: Savings,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: '#/components/schemas/Saving' },
                      },
                  },
              },
          }
    post:
      operationId: createSaving
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/SavingWrite' } },
            },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Saving' } },
              },
          }
  /savings/{id}:
    delete:
      operationId: deleteSaving
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
  /statement-imports/preview:
    post:
      operationId: previewStatementImport
      description: Reads a Bradesco card PDF, NuBank card PDF or NuBank card CSV and shows what would be imported. Nothing is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, description: Only for protected PDFs }
                cardId: { type: [string, 'null'], format: uuid }
                billDueDate: { type: [string, 'null'], description: yyyy/MM/dd }
      responses:
        '200':
          description: Statement lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementPreview' }
        '415': { description: Not a supported statement }
        '422':
          {
            description: Supported bank but unreadable content,
            such as a scanned PDF,
          }
        '423':
          { description: The PDF needs a password, or the password is wrong }
  /statement-imports:
    post:
      operationId: importStatementLines
      description: Saves the chosen lines. Lines matching a saved transaction by date, amount, description and category (installments by description, count, amount and category) are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementImportRequest' }
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementImportResult' }
  /financings:
    {
      get:
        {
          operationId: 'listFinancings',
          responses:
            {
              '200':
                {
                  description: 'Success',
                  content:
                    {
                      application/json:
                        {
                          schema:
                            {
                              type: 'array',
                              items: { $ref: '#/components/schemas/Financing' },
                            },
                        },
                    },
                },
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
            },
        },
      post:
        {
          operationId: 'createFinancing',
          responses:
            {
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
              '201':
                {
                  description: 'Success',
                  content:
                    {
                      application/json:
                        { schema: { $ref: '#/components/schemas/Financing' } },
                    },
                },
            },
          requestBody:
            {
              required: true,
              content:
                {
                  application/json:
                    { schema: { $ref: '#/components/schemas/FinancingDraft' } },
                },
            },
        },
    }
  /financings/preview:
    {
      post:
        {
          operationId: 'previewFinancing',
          responses:
            {
              '200':
                {
                  description: 'Success',
                  content:
                    {
                      application/json:
                        {
                          schema:
                            { $ref: '#/components/schemas/FinancingPreview' },
                        },
                    },
                },
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
            },
          requestBody:
            {
              required: true,
              content:
                {
                  application/json:
                    { schema: { $ref: '#/components/schemas/FinancingDraft' } },
                },
            },
        },
    }
  /financings/{id}:
    {
      get:
        {
          operationId: 'getFinancing',
          responses:
            {
              '200':
                {
                  description: 'Success',
                  content:
                    {
                      application/json:
                        { schema: { $ref: '#/components/schemas/Financing' } },
                    },
                },
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
            },
          parameters:
            [
              {
                name: 'id',
                in: 'path',
                required: true,
                schema: { type: 'string' },
              },
            ],
        },
      put:
        {
          operationId: 'putFinancing',
          responses:
            {
              '200':
                {
                  description: 'Success',
                  content:
                    {
                      application/json:
                        { schema: { $ref: '#/components/schemas/Financing' } },
                    },
                },
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
            },
          requestBody:
            {
              required: true,
              content:
                {
                  application/json:
                    { schema: { $ref: '#/components/schemas/FinancingDraft' } },
                },
            },
          parameters:
            [
              {
                name: 'id',
                in: 'path',
                required: true,
                schema: { type: 'string' },
              },
            ],
        },
      delete:
        {
          operationId: 'deleteFinancing',
          responses:
            {
              '204': { description: 'Success' },
              '400': { description: 'Invalid contract or adjustment' },
              '404': { description: 'Financing not found for this owner' },
            },
          parameters:
            [
              {
                name: 'id',
                in: 'path',
                required: true,
