            items: { $ref: '#/components/schemas/SavingValuation' },
          }
    OverviewAccount:
      type: object
      required: [id, name, balance, balanceToday, balanceCheckpointDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        balance: { type: number }
        balanceToday: { type: number }
